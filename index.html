<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes API Client</title>

    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p>API Client Prototype</p>
    </header>

    <main>

        <button id="load-btn">
            Load Notes
        </button>

        <p id="status">
            Click "Load Notes" to fetch data.
        </p>

        <form id="note-form">
            <label for="title-input">
                Title
            </label>

            <input
                type="text"
                id="title-input"
                maxlength="100"
            >

            <label for="body-input">
                Body
            </label>

            <textarea
                id="body-input"
                rows="4"
            ></textarea>

            <button
                id="submit-btn"
                type="submit"
            >
                Create Note
            </button>
        </form>

        <ul id="notes-list"></ul>

    </main>

</body>
</html>
